<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="问渠 · 技术内容分享平台" />
    <meta name="theme-color" content="#f3f6f3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>问渠</title>
    <script>
      // 首屏防闪烁：在 React 挂载前按本地偏好设置 data-theme
      ;(function () {
        try {
          var dark = localStorage.getItem('wenqu_theme') === 'dark'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0f1615' : '#f3f6f3')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
